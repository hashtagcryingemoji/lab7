services:
  kafka:
    image: bitnamilegacy/kafka:3.4.0
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"

      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"

      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      ALLOW_PLAINTEXT_LISTENER: "yes"

  kafka-init:
    image: bitnamilegacy/kafka:3.4.0

    depends_on:
      - kafka

    entrypoint: >
      bash -c "
      sleep 30 &&
      kafka-topics.sh --create --if-not-exists --topic imop.requests --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 &&
      kafka-topics.sh --create --if-not-exists --topic imop.responses --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
      "
